<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" font-family="'JetBrains Mono', monospace" font-size="13">
  <rect width="800" height="420" fill="#0A0A0A"/>
  <defs>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f59e0b"/>
    </marker>
  </defs>

  <text x="190" y="32" fill="#f59e0b" text-anchor="middle" font-weight="700">PATH: a precondition as a scenario</text>
  <text x="590" y="32" fill="#4CAF50" text-anchor="middle" font-weight="700">AXIS: a precondition as a dimension</text>
  <line x1="390" y1="50" x2="390" y2="390" stroke="#333333" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- LEFT: three straight scenario arrows -->
  <g id="left">
    <!-- scenario 1 -->
    <text x="30" y="90" fill="#ffffff" font-size="11">1</text>
    <rect x="45" y="72" width="80" height="30" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="85" y="91" fill="#f59e0b" text-anchor="middle" font-size="11">setup</text>
    <line x1="125" y1="87" x2="160" y2="87" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrO)"/>
    <rect x="162" y="72" width="80" height="30" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="202" y="91" fill="#f59e0b" text-anchor="middle" font-size="11">act</text>
    <line x1="242" y1="87" x2="277" y2="87" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrO)"/>
    <rect x="279" y="72" width="80" height="30" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="319" y="91" fill="#f59e0b" text-anchor="middle" font-size="11">assert</text>
    <text x="45" y="122" fill="#ffffff" font-size="11">book over an existing appointment → conflict</text>

    <!-- scenario 2 -->
    <text x="30" y="180" fill="#ffffff" font-size="11">2</text>
    <rect x="45" y="162" width="80" height="30" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="85" y="181" fill="#f59e0b" text-anchor="middle" font-size="11">setup</text>
    <line x1="125" y1="177" x2="160" y2="177" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrO)"/>
    <rect x="162" y="162" width="80" height="30" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="202" y="181" fill="#f59e0b" text-anchor="middle" font-size="11">act</text>
    <line x1="242" y1="177" x2="277" y2="177" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrO)"/>
    <rect x="279" y="162" width="80" height="30" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="319" y="181" fill="#f59e0b" text-anchor="middle" font-size="11">assert</text>
    <text x="45" y="212" fill="#ffffff" font-size="11">book into a free slot → no conflict</text>

    <!-- scenario 3 -->
    <text x="30" y="270" fill="#ffffff" font-size="11">3</text>
    <rect x="45" y="252" width="80" height="30" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="85" y="271" fill="#f59e0b" text-anchor="middle" font-size="11">setup</text>
    <line x1="125" y1="267" x2="160" y2="267" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrO)"/>
    <rect x="162" y="252" width="80" height="30" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="202" y="271" fill="#f59e0b" text-anchor="middle" font-size="11">act</text>
    <line x1="242" y1="267" x2="277" y2="267" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrO)"/>
    <rect x="279" y="252" width="80" height="30" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
    <text x="319" y="271" fill="#f59e0b" text-anchor="middle" font-size="11">assert</text>
    <text x="45" y="302" fill="#ffffff" font-size="11">propose into a free slot → no conflict</text>

    <text x="190" y="355" fill="#ffffff" text-anchor="middle" font-size="12">three scripts, three stories —</text>
    <text x="190" y="373" fill="#f59e0b" text-anchor="middle" font-size="12">and the fourth combination is never asked</text>
  </g>

  <!-- RIGHT: 2x2 grid -->
  <g id="right">
    <!-- axis labels -->
    <text x="600" y="78" fill="#ffffff" text-anchor="middle" font-size="12">what the test does (primary data)</text>
    <text x="545" y="102" fill="#ffffff" text-anchor="middle" font-size="11">book</text>
    <text x="675" y="102" fill="#ffffff" text-anchor="middle" font-size="11">propose</text>

    <text transform="translate(421,235) rotate(-90)" fill="#ffffff" text-anchor="middle" font-size="12">what exists (secondary data)</text>
    <text x="474" y="170" fill="#ffffff" text-anchor="end" font-size="11">free</text>
    <text x="474" y="270" fill="#ffffff" text-anchor="end" font-size="11">taken</text>

    <!-- cells -->
    <rect x="480" y="115" width="130" height="100" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <text x="545" y="160" fill="#ffffff" text-anchor="middle" font-size="11">no conflict</text>
    <text x="545" y="178" fill="#ffffff" text-anchor="middle" font-size="10">script 2</text>

    <rect x="610" y="115" width="130" height="100" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <text x="675" y="160" fill="#ffffff" text-anchor="middle" font-size="11">no conflict</text>
    <text x="675" y="178" fill="#ffffff" text-anchor="middle" font-size="10">script 3</text>

    <rect x="480" y="215" width="130" height="100" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <text x="545" y="260" fill="#ffffff" text-anchor="middle" font-size="11">conflict</text>
    <text x="545" y="278" fill="#ffffff" text-anchor="middle" font-size="10">script 1</text>

    <rect x="610" y="215" width="130" height="100" fill="#0f2a12" stroke="#4CAF50" stroke-width="2.5"/>
    <text x="675" y="252" fill="#4CAF50" text-anchor="middle" font-weight="700" font-size="11">NO conflict</text>
    <text x="675" y="270" fill="#4CAF50" text-anchor="middle" font-size="10">marker: e</text>
    <text x="675" y="292" fill="#ffffff" text-anchor="middle" font-size="10">the case nobody writes</text>

    <text x="600" y="355" fill="#ffffff" text-anchor="middle" font-size="12">two axes, four cells —</text>
    <text x="600" y="373" fill="#4CAF50" text-anchor="middle" font-size="12">the grid asks the question the scripts skipped</text>
  </g>
</svg>
