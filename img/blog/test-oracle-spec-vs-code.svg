<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" font-family="JetBrains Mono, monospace" font-size="14" fill="#ffffff">
  <rect width="800" height="420" fill="#0A0A0A"/>
  <text x="400" y="34" text-anchor="middle" font-size="16" font-weight="700">Where the expected value comes from</text>
  <!-- left: constant in src -->
  <rect x="40" y="90" width="300" height="60" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <text x="190" y="115" text-anchor="middle" fill="#f59e0b">test</text>
  <text x="190" y="137" text-anchor="middle" font-size="12">expects InvoiceTypeCode = 380</text>
  <rect x="40" y="230" width="300" height="60" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <text x="190" y="255" text-anchor="middle" fill="#f59e0b">src/constants.ts</text>
  <text x="190" y="277" text-anchor="middle" font-size="12">DEFAULT_TYPE_CODE = 380</text>
  <path d="M120 150 V230" stroke="#f59e0b" stroke-width="2" fill="none" marker-end="url(#ao)"/>
  <path d="M260 230 V150" stroke="#f59e0b" stroke-width="2" fill="none" marker-end="url(#ao)"/>
  <text x="190" y="196" text-anchor="middle" font-size="12" fill="#f59e0b">same codebase, both ways</text>
  <text x="190" y="330" text-anchor="middle" fill="#f59e0b" font-weight="700">confirms the code</text>
  <text x="190" y="352" text-anchor="middle" font-size="12">726 green, 326 never seen</text>
  <!-- right: pinned spec -->
  <rect x="460" y="90" width="300" height="60" fill="none" stroke="#4CAF50" stroke-width="2"/>
  <text x="610" y="115" text-anchor="middle" fill="#4CAF50">test</text>
  <text x="610" y="137" text-anchor="middle" font-size="12">expects every code BR-DE-17 lists</text>
  <rect x="460" y="230" width="300" height="60" fill="none" stroke="#4CAF50" stroke-width="2"/>
  <text x="610" y="255" text-anchor="middle" fill="#4CAF50">XRechnung.sch  (sha256-pinned)</text>
  <text x="610" y="277" text-anchor="middle" font-size="12">380 · 326 · 384 · 389 · 381 · 875 …</text>
  <path d="M610 230 V150" stroke="#4CAF50" stroke-width="2" fill="none" marker-end="url(#ag)"/>
  <text x="640" y="196" font-size="12" fill="#4CAF50">one direction</text>
  <text x="610" y="330" text-anchor="middle" fill="#4CAF50" font-weight="700">finds the bug in the code</text>
  <text x="610" y="352" text-anchor="middle" font-size="12">326 missing, 386 not in BR-DE-17</text>
  <!-- middle -->
  <line x1="400" y1="80" x2="400" y2="370" stroke="#333333" stroke-dasharray="4 4"/>
  <text x="400" y="400" text-anchor="middle" font-size="12" fill="#E61919">380 was our default. 326 was the customer&#8217;s invoice.</text>
  <defs>
    <marker id="ao" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#f59e0b"/></marker>
    <marker id="ag" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#4CAF50"/></marker>
  </defs>
</svg>
