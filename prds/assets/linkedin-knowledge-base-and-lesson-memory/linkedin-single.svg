<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img"
     aria-label="327 lessons, one per file. ~20 failure classes. 3× the same bug fixed, each time a comment. A session starts empty. Every single time. Two stores decide what the next session knows: knowledge base: how does our system work?; lesson memory: what went wrong, and why?; every lesson with its mechanism, not its story; both are claims the present has to confirm; Part 4 of 9: two stores for two questions.">
  <!-- LinkedIn single image, 1:1, companion to /blog/2026/10/13/knowledge-base-and-lesson-memory.
       Colours follow the Nanook dark theme; same template as linkedin-agentic-development-overview;
       re-render with qlmanage -t -s 1200. -->
  <defs>
    <style>
      .mono { font-family: "SFMono-Regular","JetBrains Mono",Menlo,Consolas,monospace; }
      .kick { font-size: 24px; fill: #E61919; font-weight: 700; letter-spacing: 4px; }
      .n    { font-size: 108px; font-weight: 700; letter-spacing: -4px; }
      .lbl  { font-size: 22px; fill: #8a8a8a; }
      .head { font-size: 50px; font-weight: 700; fill: #ffffff; letter-spacing: -1px; }
      .sub  { font-size: 29px; fill: #d4d4d4; }
      .row  { font-size: 30px; fill: #ffffff; }
      .num  { font-size: 30px; fill: #4CAF50; font-weight: 700; }
      .foot { font-size: 21px; fill: #8a8a8a; letter-spacing: 2px; }
    </style>
  </defs>
  <rect width="1200" height="1200" fill="#0A0A0A"/>
  <rect x="0" y="0" width="1200" height="8" fill="#E61919"/>

  <text class="mono kick" x="90" y="120">NANOOK · AGENTIC SOFTWARE DEVELOPMENT</text>

  <text class="mono n" x="90" y="290" fill="#8a8a8a">327</text>
  <text class="mono lbl" x="90" y="335">lessons,</text>
  <text class="mono lbl" x="90" y="363">one per file</text>
  <text class="mono n" x="320" y="290" fill="#8a8a8a">~20</text>
  <text class="mono lbl" x="320" y="335">failure</text>
  <text class="mono lbl" x="320" y="363">classes</text>
  <text class="mono n" x="551" y="290" fill="#ffffff">3×</text>
  <text class="mono lbl" x="551" y="335">the same bug fixed,</text>
  <text class="mono lbl" x="551" y="363">each time a comment</text>

  <line x1="90" y1="400" x2="1110" y2="400" stroke="#333333" stroke-width="2"/>

  <text class="mono head" x="90" y="488">A session starts empty.</text>
  <text class="mono head" x="90" y="558">Every single time.</text>
  <text class="mono sub" x="90" y="615">Two stores decide what the next session knows:</text>

  <rect x="90" y="660" width="1020" height="300" fill="#121212"/>
  <rect x="90" y="660" width="10" height="300" fill="#4CAF50"/>
  <text class="mono num" x="140" y="720">1</text>
  <text class="mono row" x="200" y="720">knowledge base: how does our system work?</text>
  <text class="mono num" x="140" y="780">2</text>
  <text class="mono row" x="200" y="780">lesson memory: what went wrong, and why?</text>
  <text class="mono num" x="140" y="840">3</text>
  <text class="mono row" x="200" y="840">every lesson with its mechanism, not its story</text>
  <text class="mono num" x="140" y="900">4</text>
  <text class="mono row" x="200" y="900">both are claims the present has to confirm</text>

  <text class="mono foot" x="90" y="1090">PART 4 OF 9 · TWO STORES FOR TWO QUESTIONS</text>
  <text class="mono foot" x="90" y="1125">nanook.xhub.io/blog</text>
