<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img"
     aria-label="11 days, one AI agent. 806 tests, 805 passing. 214 cases generated from 13 sheets. First the tables. Then the tests. Then the service. An event-driven service: Kafka in, Postgres as state, Kafka out, REST for a user interface. tables found the holes before any code; 245 tests red, all with the same message; 280 green, zero changed expectations; 391 green, and the bundle did not start; Field report: companion to part 5 of 9.">
  <!-- LinkedIn single image, 1:1, companion to /blog/2026/10/21/service-in-eleven-days-tables-that-contradict.
       Colours follow the Nanook dark theme; same template as linkedin-agentic-development-overview;
       re-render with qlmanage -t -s 1200. -->
  <defs>
    <style>
      .mono { font-family: "SFMono-Regular","JetBrains Mono",Menlo,Consolas,monospace; }
      .kick { font-size: 24px; fill: #E61919; font-weight: 700; letter-spacing: 4px; }
      .n    { font-size: 108px; font-weight: 700; letter-spacing: -4px; }
      .lbl  { font-size: 22px; fill: #8a8a8a; }
      .head { font-size: 50px; font-weight: 700; fill: #ffffff; letter-spacing: -1px; }
      .sub  { font-size: 29px; fill: #d4d4d4; }
      .row  { font-size: 30px; fill: #ffffff; }
      .num  { font-size: 30px; fill: #4CAF50; font-weight: 700; }
      .foot { font-size: 21px; fill: #8a8a8a; letter-spacing: 2px; }
    </style>
  </defs>
  <rect width="1200" height="1200" fill="#0A0A0A"/>
  <rect x="0" y="0" width="1200" height="8" fill="#E61919"/>

  <text class="mono kick" x="90" y="120">NANOOK · AGENTIC SOFTWARE DEVELOPMENT</text>

  <text class="mono n" x="90" y="290" fill="#8a8a8a">11</text>
  <text class="mono lbl" x="90" y="335">days,</text>
  <text class="mono lbl" x="90" y="363">one AI agent</text>
  <text class="mono n" x="296" y="290" fill="#8a8a8a">806</text>
  <text class="mono lbl" x="296" y="335">tests,</text>
  <text class="mono lbl" x="296" y="363">805 passing</text>
  <text class="mono n" x="527" y="290" fill="#ffffff">214</text>
  <text class="mono lbl" x="527" y="335">cases generated</text>
  <text class="mono lbl" x="527" y="363">from 13 sheets</text>

  <line x1="90" y1="400" x2="1110" y2="400" stroke="#333333" stroke-width="2"/>

  <text class="mono head" x="90" y="488">First the tables.</text>
  <text class="mono head" x="90" y="558">Then the tests. Then the service.</text>
  <text class="mono sub" x="90" y="615">An event-driven service: Kafka in, Postgres as</text>
  <text class="mono sub" x="90" y="655">state, Kafka out, REST for a user interface.</text>

  <rect x="90" y="700" width="1020" height="300" fill="#121212"/>
  <rect x="90" y="700" width="10" height="300" fill="#4CAF50"/>
  <text class="mono num" x="140" y="760">1</text>
  <text class="mono row" x="200" y="760">tables found the holes before any code</text>
  <text class="mono num" x="140" y="820">2</text>
  <text class="mono row" x="200" y="820">245 tests red, all with the same message</text>
  <text class="mono num" x="140" y="880">3</text>
  <text class="mono row" x="200" y="880">280 green, zero changed expectations</text>
  <text class="mono num" x="140" y="940">4</text>
  <text class="mono row" x="200" y="940">391 green, and the bundle did not start</text>

  <text class="mono foot" x="90" y="1090">FIELD REPORT · COMPANION TO PART 5 OF 9</text>
  <text class="mono foot" x="90" y="1125">nanook.xhub.io/blog</text>
</svg>
