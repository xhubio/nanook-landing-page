<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img"
     aria-label="40 pages of specification. 12 good designs, already written. 8 findings before any code existed. Prose does not lie. It stays silent. A table demands what prose does not: every field needs classes; every combination needs a row; every row needs a result; every empty cell is a question for the spec; Part 5 of 9: forcing requirements into decision tables.">
  <!-- LinkedIn single image, 1:1, companion to /blog/2026/10/20/requirements-into-decision-tables.
       Colours follow the Nanook dark theme; same template as linkedin-agentic-development-overview;
       re-render with qlmanage -t -s 1200. -->
  <defs>
    <style>
      .mono { font-family: "SFMono-Regular","JetBrains Mono",Menlo,Consolas,monospace; }
      .kick { font-size: 24px; fill: #E61919; font-weight: 700; letter-spacing: 4px; }
      .n    { font-size: 108px; font-weight: 700; letter-spacing: -4px; }
      .lbl  { font-size: 22px; fill: #8a8a8a; }
      .head { font-size: 50px; font-weight: 700; fill: #ffffff; letter-spacing: -1px; }
      .sub  { font-size: 29px; fill: #d4d4d4; }
      .row  { font-size: 30px; fill: #ffffff; }
      .num  { font-size: 30px; fill: #4CAF50; font-weight: 700; }
      .foot { font-size: 21px; fill: #8a8a8a; letter-spacing: 2px; }
    </style>
  </defs>
  <rect width="1200" height="1200" fill="#0A0A0A"/>
  <rect x="0" y="0" width="1200" height="8" fill="#E61919"/>

  <text class="mono kick" x="90" y="120">NANOOK · AGENTIC SOFTWARE DEVELOPMENT</text>

  <text class="mono n" x="90" y="290" fill="#8a8a8a">40</text>
  <text class="mono lbl" x="90" y="335">pages of</text>
  <text class="mono lbl" x="90" y="363">specification</text>
  <text class="mono n" x="310" y="290" fill="#8a8a8a">12</text>
  <text class="mono lbl" x="310" y="335">good designs,</text>
  <text class="mono lbl" x="310" y="363">already written</text>
  <text class="mono n" x="556" y="290" fill="#ffffff">8</text>
  <text class="mono lbl" x="556" y="335">findings before</text>
  <text class="mono lbl" x="556" y="363">any code existed</text>

  <line x1="90" y1="400" x2="1110" y2="400" stroke="#333333" stroke-width="2"/>

  <text class="mono head" x="90" y="488">Prose does not lie.</text>
  <text class="mono head" x="90" y="558">It stays silent.</text>
  <text class="mono sub" x="90" y="615">A table demands what prose does not:</text>

  <rect x="90" y="660" width="1020" height="300" fill="#121212"/>
  <rect x="90" y="660" width="10" height="300" fill="#4CAF50"/>
  <text class="mono num" x="140" y="720">1</text>
  <text class="mono row" x="200" y="720">every field needs classes</text>
  <text class="mono num" x="140" y="780">2</text>
  <text class="mono row" x="200" y="780">every combination needs a row</text>
  <text class="mono num" x="140" y="840">3</text>
  <text class="mono row" x="200" y="840">every row needs a result</text>
  <text class="mono num" x="140" y="900">4</text>
  <text class="mono row" x="200" y="900">every empty cell is a question for the spec</text>

  <text class="mono foot" x="90" y="1090">PART 5 OF 9 · FORCING REQUIREMENTS INTO DECISION TABLES</text>
  <text class="mono foot" x="90" y="1125">nanook.xhub.io/blog</text>
</svg>
