<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img"
     aria-label="14 skills never invoked. 91 sessions, one month. 170 lines in the instruction file. Every skill costs tokens on every single request. Unused capability is not free. Four rules that keep the agent&#x27;s context small: archive what is unused, measured, not guessed; one sentence per hard rule, nothing more; the long version loads only where it applies; choose every model with the budget in view; Part 2 of 9: the toolbox, the instruction file, the budget.">
