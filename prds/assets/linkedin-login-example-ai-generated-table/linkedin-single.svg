<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img"
     aria-label="36 combinations, 8 test cases, 7 came out of the first run. Check the number. One column, E_passwordTooShort: account active, email valid, password too short — exactly one thing wrong.">
  <!-- LinkedIn single image, 1:1, companion to /blog/2026/08/22/login-example-ai-generated-table.
       Colours follow the Nanook dark theme; re-render with qlmanage -t -s 1200. -->
  <defs>
    <style>
      .mono { font-family: "SFMono-Regular","JetBrains Mono",Menlo,Consolas,monospace; }
      .kick { font-size: 24px; fill: #E61919; font-weight: 700; letter-spacing: 4px; }
      .n    { font-size: 150px; font-weight: 700; letter-spacing: -6px; }
      .lbl  { font-size: 22px; fill: #8a8a8a; }
      .head { font-size: 66px; font-weight: 700; fill: #ffffff; letter-spacing: -1px; }
      .sub  { font-size: 29px; fill: #d4d4d4; }
      .col  { font-size: 26px; fill: #8a8a8a; }
      .rowl { font-size: 30px; fill: #ffffff; }
      .ok   { font-size: 30px; fill: #4CAF50; font-weight: 700; }
      .bad  { font-size: 30px; fill: #E61919; font-weight: 700; }
      .cap  { font-size: 26px; fill: #d4d4d4; }
      .foot { font-size: 21px; fill: #8a8a8a; letter-spacing: 2px; }
    </style>
  </defs>
  <rect width="1200" height="1200" fill="#0A0A0A"/>
  <rect x="0" y="0" width="1200" height="8" fill="#E61919"/>

  <text class="mono kick" x="90" y="120">NANOOK · A LOGIN FORM, ONE TABLE</text>

  <text class="mono n" x="90" y="300" fill="#8a8a8a">36</text>
  <text class="mono lbl" x="90" y="345">combinations</text>
  <text class="mono n" x="430" y="300" fill="#ffffff">8</text>
  <text class="mono lbl" x="430" y="345">test cases · 100%</text>
  <text class="mono n" x="800" y="300" fill="#E61919">7</text>
  <text class="mono lbl" x="800" y="345">came out of</text>
  <text class="mono lbl" x="800" y="371">the first run</text>

  <line x1="90" y1="400" x2="1110" y2="400" stroke="#333333" stroke-width="2"/>

  <text class="mono head" x="90" y="490">Check the number.</text>
  <text class="mono sub" x="90" y="545">A case that fails to generate turns nothing red.</text>
  <text class="mono sub" x="90" y="585">The error sits in the log. The case is simply not there.</text>

  <rect x="90" y="650" width="1020" height="330" fill="#121212"/>
  <rect x="90" y="650" width="10" height="330" fill="#4CAF50"/>
  <text class="mono col" x="140" y="705">one column · E_passwordTooShort</text>
  <text class="mono rowl" x="140" y="770">account</text>
  <text class="mono rowl" x="440" y="770">active</text>
  <text class="mono ok" x="900" y="770">right</text>
  <text class="mono rowl" x="140" y="830">email</text>
  <text class="mono rowl" x="440" y="830">valid</text>
  <text class="mono ok" x="900" y="830">right</text>
  <text class="mono rowl" x="140" y="890">password</text>
  <text class="mono rowl" x="440" y="890">too short</text>
  <text class="mono bad" x="900" y="890">wrong</text>
  <text class="mono cap" x="140" y="950">exactly one thing wrong — everything else right</text>

  <text class="mono foot" x="90" y="1110">/createEquivalenceClassTable Login Form</text>
  <text class="mono foot" x="90" y="1145">nanook.xhub.io</text>
</svg>
